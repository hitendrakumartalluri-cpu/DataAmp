replicaCount: 2
image:
  repository: amp-enterprise
  tag: 0.9.0-beta.3.1
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
config:
  databaseUrlSecret: amp-db
  apiKeySecret: amp-api
  demoMode: "false"
  dataRoot: /data
resources:
  requests: {cpu: 250m, memory: 256Mi}
  limits: {cpu: "2", memory: 2Gi}
readinessProbe:
  path: /readyz
livenessProbe:
  path: /healthz

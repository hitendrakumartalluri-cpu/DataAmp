<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AMP Enterprise</title>
  <link rel="stylesheet" href="/static/styles.css?v=0.9.0-beta.6.0-dev.1"/>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">A</div><div><strong>AMP</strong><span>Enterprise Beta</span></div></div>
    <nav id="nav">
      <button class="nav-item active" data-page="overview"><span>⌂</span>Overview</button>

apiVersion: v1
kind: Namespace
metadata:
  name: amp-lab
---
apiVersion: v1
kind: Secret
metadata:
  name: amp-lab-secrets
  namespace: amp-lab
type: Opaque
stringData:
  postgres-password: amp_lab_change_me
  primary-access-key: ampprimary
  primary-secret-key: ampprimary-change-me
  legacy-access-key: amplegacy
  legacy-secret-key: amplegacy-change-me
  hop-user: amp-hop
  hop-password: amp-hop-change-me
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: amp-lab
spec:
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: amp-lab
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          env:
            - {name: POSTGRES_DB, value: amp}
            - {name: POSTGRES_USER, value: amp}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: amp-lab-secrets, key: postgres-password}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U amp -d amp"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          hostPath: {path: /var/local/amp-lab/postgres, type: DirectoryOrCreate}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: amp-lab
spec:
  selector: {app: kafka}
  ports:
    - {name: broker, port: 9092, targetPort: 9092}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: amp-lab
spec:
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "INTERNAL://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_NUM_PARTITIONS, value: "12"}
          ports: [{containerPort: 9092}, {containerPort: 9093}]
          readinessProbe:
            exec: {command: ["sh", "-c", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]}
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts: [{name: data, mountPath: /var/lib/kafka/data}]
      volumes:
        - name: data
          hostPath: {path: /var/local/amp-lab/kafka, type: DirectoryOrCreate}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  namespace: amp-lab
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: apache/kafka:3.9.1
          command: ["bash", "-lc"]
          args:
            - >-
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do sleep 2; done;
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic amp.storage.changes --partitions 12 --replication-factor 1;
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic amp.storage.changes.dlq --partitions 3 --replication-factor 1;
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic amp.raw.minio.primary --partitions 3 --replication-factor 1;
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic amp.raw.minio.legacy --partitions 3 --replication-factor 1
---
apiVersion: v1
kind: Service
metadata:
  name: minio-primary
  namespace: amp-lab
spec:
  type: NodePort
  selector: {app: minio-primary}
  ports:
    - {name: s3, port: 9000, targetPort: 9000, nodePort: 30900}
    - {name: console, port: 9001, targetPort: 9001, nodePort: 30901}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-primary
  namespace: amp-lab
spec:
  replicas: 1
  selector: {matchLabels: {app: minio-primary}}
  template:
    metadata: {labels: {app: minio-primary}}
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-05-24T17-08-30Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: amp-lab-secrets, key: primary-access-key}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: amp-lab-secrets, key: primary-secret-key}}
            - {name: MINIO_NOTIFY_KAFKA_ENABLE_AMP, value: "on"}
            - {name: MINIO_NOTIFY_KAFKA_BROKERS_AMP, value: "kafka:9092"}
            - {name: MINIO_NOTIFY_KAFKA_TOPIC_AMP, value: amp.raw.minio.primary}
            - {name: MINIO_NOTIFY_KAFKA_QUEUE_DIR_AMP, value: "/data/.events"}
            - {name: MINIO_NOTIFY_KAFKA_QUEUE_LIMIT_AMP, value: "100000"}
          ports: [{containerPort: 9000}, {containerPort: 9001}]
          readinessProbe: {tcpSocket: {port: 9000}, initialDelaySeconds: 5, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          hostPath: {path: /var/local/amp-lab/minio-primary, type: DirectoryOrCreate}
---
apiVersion: v1
kind: Service
metadata:
  name: minio-legacy
  namespace: amp-lab
spec:
  type: NodePort
  selector: {app: minio-legacy}
  ports:
    - {name: s3, port: 9000, targetPort: 9000, nodePort: 30910}

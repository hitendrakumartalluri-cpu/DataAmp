          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: amp-lab-secrets, key: legacy-access-key}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: amp-lab-secrets, key: legacy-secret-key}}
            - {name: MINIO_NOTIFY_KAFKA_ENABLE_AMP, value: "on"}
            - {name: MINIO_NOTIFY_KAFKA_BROKERS_AMP, value: "kafka:9092"}
            - {name: MINIO_NOTIFY_KAFKA_TOPIC_AMP, value: amp.raw.minio.legacy}
            - {name: MINIO_NOTIFY_KAFKA_QUEUE_DIR_AMP, value: "/data/.events"}
            - {name: MINIO_NOTIFY_KAFKA_QUEUE_LIMIT_AMP, value: "100000"}
          ports: [{containerPort: 9000}, {containerPort: 9001}]
          readinessProbe: {tcpSocket: {port: 9000}, initialDelaySeconds: 5, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          hostPath: {path: /var/local/amp-lab/minio-legacy, type: DirectoryOrCreate}
---
apiVersion: v1
kind: Service
metadata:
  name: solr
  namespace: amp-lab
spec:
  type: NodePort
  selector: {app: solr}
  ports:
    - {name: http, port: 8983, targetPort: 8983, nodePort: 30983}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solr
  namespace: amp-lab
spec:
  replicas: 1
  selector: {matchLabels: {app: solr}}
  template:
    metadata: {labels: {app: solr}}
    spec:
      containers:
        - name: solr
          image: solr:10.0.0
          args: ["solr-precreate", "amp_objects"]
          ports: [{containerPort: 8983}]
          readinessProbe: {httpGet: {path: /solr/admin/info/system, port: 8983}, initialDelaySeconds: 15, periodSeconds: 10}
          volumeMounts: [{name: data, mountPath: /var/solr}]
      volumes:
        - name: data
          hostPath: {path: /var/local/amp-lab/solr, type: DirectoryOrCreate}
---
apiVersion: v1
kind: Service
metadata:
  name: tika
  namespace: amp-lab
spec:
  type: NodePort
  selector: {app: tika}
  ports:
    - {name: http, port: 9998, targetPort: 9998, nodePort: 30998}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  namespace: amp-lab
spec:
  replicas: 1
  selector: {matchLabels: {app: tika}}
  template:
    metadata: {labels: {app: tika}}
    spec:
      containers:
        - name: tika
          image: apache/tika:4.0.0-1-full
          ports: [{containerPort: 9998}]
          readinessProbe: {httpGet: {path: /version, port: 9998}, initialDelaySeconds: 15, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata:
  name: hop
  namespace: amp-lab
spec:
  type: NodePort
  selector: {app: hop}
  ports:
    - {name: http, port: 8080, targetPort: 8080, nodePort: 30882}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hop
  namespace: amp-lab
spec:
  replicas: 1
  selector: {matchLabels: {app: hop}}
  template:
    metadata: {labels: {app: hop}}
    spec:
      containers:
        - name: hop
          image: apache/hop:2.19.0
          env:
            - {name: HOP_SERVER_PORT, value: "8080"}
            - name: HOP_SERVER_USER
              valueFrom: {secretKeyRef: {name: amp-lab-secrets, key: hop-user}}
            - name: HOP_SERVER_PASS
              valueFrom: {secretKeyRef: {name: amp-lab-secrets, key: hop-password}}
          ports: [{containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: 8080}, initialDelaySeconds: 15, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata:
  name: amp
  namespace: amp-lab
spec:
  type: NodePort
  selector: {app: amp}
  ports:
    - {name: http, port: 8080, targetPort: 8080, nodePort: 30080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amp
  namespace: amp-lab
spec:
  replicas: 1
  selector: {matchLabels: {app: amp}}
  template:
    metadata: {labels: {app: amp}}
    spec:
      containers:
        - name: amp
          image: amp-enterprise:0.9.0-beta.5.0
          imagePullPolicy: IfNotPresent
          env:
            - name: AMP_DATABASE_URL
              value: postgresql://amp:amp_lab_change_me@postgres:5432/amp
            - {name: AMP_DEMO_MODE, value: "false"}
            - {name: AMP_DEFAULT_TENANT, value: demo}
            - {name: AMP_TIKA_URL, value: "http://tika:9998"}
            - {name: AMP_SOLR_URL, value: "http://solr:8983/solr"}
            - {name: AMP_SOLR_COLLECTION, value: amp_objects}
            - {name: AMP_HOP_URL, value: "http://hop:8080"}
            - {name: AMP_KAFKA_BOOTSTRAP, value: "kafka:9092"}
            - {name: AMP_KAFKA_STORAGE_TOPIC, value: amp.storage.changes}
            - {name: AMP_KAFKA_DLQ_TOPIC, value: amp.storage.changes.dlq}
            - {name: AMP_LAB_PRIMARY_ENDPOINT, value: "http://minio-primary:9000"}
            - {name: AMP_LAB_LEGACY_ENDPOINT, value: "http://minio-legacy:9000"}
            - {name: AMP_LAB_PRIMARY_BUCKET, value: amp-primary}
            - {name: AMP_LAB_LEGACY_BUCKET, value: legacy-hcp}
            - name: AMP_LAB_PRIMARY_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: amp-lab-secrets, key: primary-access-key}}
            - name: AMP_LAB_PRIMARY_SECRET_KEY
              valueFrom: {secretKeyRef: {name: amp-lab-secrets, key: primary-secret-key}}
            - name: AMP_LAB_LEGACY_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: amp-lab-secrets, key: legacy-access-key}}
            - name: AMP_LAB_LEGACY_SECRET_KEY
              valueFrom: {secretKeyRef: {name: amp-lab-secrets, key: legacy-secret-key}}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10, periodSeconds: 10}

---
apiVersion: apps/v1
kind: Deployment

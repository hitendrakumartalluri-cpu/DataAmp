  namespace: amp-lab
spec:
  replicas: 1
  selector: {matchLabels: {app: amp-events}}
  template:
    metadata: {labels: {app: amp-events}}
    spec:
      containers:
        - name: worker
          image: amp-enterprise:0.9.0-beta.5.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.event_worker", "consume-normalized"]
          env:
            - {name: AMP_DATABASE_URL, value: "postgresql://amp:amp_lab_change_me@postgres:5432/amp"}
            - {name: AMP_DEMO_MODE, value: "false"}
            - {name: AMP_KAFKA_BOOTSTRAP, value: "kafka:9092"}
            - {name: AMP_KAFKA_STORAGE_TOPIC, value: amp.storage.changes}
            - {name: AMP_KAFKA_DLQ_TOPIC, value: amp.storage.changes.dlq}

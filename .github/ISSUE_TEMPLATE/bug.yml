name: Bug
description: Report incorrect AMP behavior
title: "[BUG] "
labels: ["type:bug", "status:proposed"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and environment
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and evidence

